[package]
name = "syntrix-core"
version = "0.1.0"
edition = "2021"
description = "Shared P2P sync primitives for syntrix-admin and syntrix-client"

[dependencies]
iroh         = { version = "=1.0.0-rc.1" }
iroh-docs    = { git = "https://github.com/royalcala/iroh-docs", branch = "syntrix", features = ["fs-store"] }
iroh-blobs   = { version = "=0.102.0" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
chrono       = "0.4"
anyhow       = "1"
tokio        = { version = "1", features = ["full"] }
futures-util = "0.3"
syntrix-schema = { path = "../syntrix-schema" }
