[package]
name = "syntrix-core"
version = "0.1.0"
edition = "2021"
description = "Shared P2P sync primitives for syntrix-admin and syntrix-client"

[dependencies]
syntrix-network = { path = "../syntrix-network" }
libp2p-identity = "0.2"
libp2p = { version = "0.54", default-features = false, features = ["identify"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
chrono       = "0.4"
anyhow       = "1"
tokio        = { version = "1", features = ["full"] }
futures-util = "0.3"
