[package]
name = "syntrix-network"
version = "0.1.0"
edition = "2021"
description = "libp2p-based P2P networking for syntrix"

[dependencies]
libp2p = { version = "0.56", features = [
    "quic", "tcp", "dns", "gossipsub", "kad", "identify", "ping",
    "request-response", "noise", "yamux", "macros", "tokio",
    "autonat", "relay", "dcutr",
] }
libp2p-swarm-derive = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
bytes = "1"
hex = "0.4"
tracing = "0.1"
async-trait = "0.1"
blake3 = "1"
turso_core.workspace = true

[dev-dependencies]
tempfile = "3"
