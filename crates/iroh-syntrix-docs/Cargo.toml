[package]
name = "iroh-syntrix-docs"
version = "0.2.0"
edition = "2021"
description = "Authorization wrapper for iroh-docs — device-centric, multi-org, capability-aware"
license = "MIT/Apache-2.0"
repository = "https://github.com/royalcala/iroh-syntrix-docs"

[dependencies]
iroh-docs = { git = "https://github.com/royalcala/iroh-docs", branch = "syntrix" }
iroh = { version = "=1.0.0-rc.1", default-features = false }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

[dev-dependencies]
iroh = { version = "=1.0.0-rc.1", features = ["test-utils"] }
iroh-blobs = { version = "=0.102.0" }
iroh-gossip = { version = "=0.100.0" }
iroh-relay = { version = "=1.0.0-rc.1", features = ["server"] }
futures-util = "0.3"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
