[package]
name = "syntrix-testkit"
version = "0.1.0"
edition = "2021"
description = "Headless test harness helpers for syntrix-admin and syntrix-client"

[dependencies]
syntrix-core = { path = "../syntrix-core" }
syntrix-network = { path = "../syntrix-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tempfile = "3"
turso_core.workspace = true
