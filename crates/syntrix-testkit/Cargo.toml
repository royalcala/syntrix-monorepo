[package]
name = "syntrix-testkit"
version = "0.1.0"
edition = "2021"
description = "Headless test harness helpers for syntrix-admin and syntrix-client"

[dependencies]
syntrix-core = { path = "../syntrix-core" }
syntrix-schema = { path = "../syntrix-schema" }
iroh = { version = "=1.0.0-rc.1" }
iroh-docs = { git = "https://github.com/royalcala/iroh-docs", branch = "syntrix", features = ["fs-store"] }
iroh-blobs = { version = "=0.102.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tempfile = "3"
