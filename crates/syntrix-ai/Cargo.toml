[package]
name = "syntrix-ai"
version = "0.1.0"
edition = "2021"
description = "AI agent loop, tools, model router and benchmarks for Syntrix P2P IA platform"

[dependencies]
syntrix-core = { path = "../syntrix-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
syntrix-testkit = { path = "../syntrix-testkit" }
tempfile = "3"
