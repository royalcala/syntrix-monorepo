[package]
name = "syntrix-relay"
version = "0.1.0"
edition = "2021"
description = "Self-hosted libp2p relay server for NAT traversal"

[dependencies]
libp2p = { version = "0.56", features = ["quic", "tcp", "dns", "noise", "yamux", "relay", "macros", "tokio", "ping"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
