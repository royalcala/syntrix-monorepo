[package]
name = "syntrix-admin"
version = "0.1.0"
edition = "2021"

[lib]
name = "syntrix_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntrix-core = { path = "../../../crates/syntrix-core" }
syntrix-network = { path = "../../../crates/syntrix-network" }
syntrix-schema = { path = "../../../crates/syntrix-schema" }
syntrix-logging = { path = "../../../crates/syntrix-logging" }
libp2p = { version = "0.54", features = ["identify"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
chrono = "0.4"
tracing = "0.1"
dirs-next = "2"
futures-util = "0.3"
redb = "2.1.2"
bytes = "1"
fastrand = "2"

[dev-dependencies]
syntrix-testkit = { path = "../../../crates/syntrix-testkit" }
syntrix-client = { path = "../../client/src-tauri" }
